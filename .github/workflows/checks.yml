name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -p .venv/bin/python -e . pytest ruff ty
      - run: .venv/bin/ruff format --check src tests examples
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/ty check --python .venv src
      - run: .venv/bin/python -m pytest tests -q
